<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ciclo de Vida — Inventory Run</title>
  <style>
    :root { color-scheme:dark; --bg:#020617; --panel:#0f172a; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; } *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#020617,#0f172a);color:var(--text);font:14px/1.45 system-ui,sans-serif} main{max-width:1240px;margin:auto;padding:32px 20px 48px} h1{margin:0;font-size:clamp(1.45rem,3vw,2rem)} .lead{color:var(--muted);margin:6px 0 24px}.diagram{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#020617;box-shadow:0 18px 50px #0005}svg{display:block;min-width:920px;width:100%;height:auto}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0;color:var(--muted)}.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card h2{font-size:1rem;margin:0 0 8px}.card ul{padding-left:18px;color:var(--muted);margin:0}.card li+li{margin-top:5px}
  </style>
</head>
<body>
  <main><h1 id="title"></h1><p class="lead">Estados y transiciones de una ejecución de inventario.</p><div class="legend"><span style="--c:#34d399">flujo correcto</span><span style="--c:#fbbf24">espera</span><span style="--c:#fb7185">cancelación o fallo</span></div><div class="diagram"><svg id="diagram" role="img" aria-labelledby="title"></svg></div><section class="cards" id="cards" aria-label="Notas del diagrama"></section></main>
  <script>
    const data={title:'Ciclo de Vida — Inventory Run',states:[['queued','Queued','run_id generado',130,180,'#22d3ee'],['running','Running','recolectando AWS',405,180,'#34d399'],['completed','Completed','recursos persistidos',680,180,'#34d399'],['cancel_wait','Cancel Requested','señal registrada',405,350,'#fbbf24'],['cancelled','Cancelled','detenido',130,520,'#fb7185'],['failed','Failed','excepción',680,520,'#fb7185']],transitions:[['queued','running','background task inicia','#34d399'],['running','completed','save_many() ok','#34d399'],['running','cancel_wait','POST /cancel','#fbbf24'],['cancel_wait','cancelled','loop detecta flag','#fb7185'],['running','failed','excepción','#fb7185']],cards:[['Flujo normal',['queued crea y devuelve el run_id.','running representa la recolección AWS.','completed se alcanza tras persistir los recursos.']],['Cancelación cooperativa',['POST /cancel registra una señal.','El loop revisa la señal en cada iteración.','El run termina cancelled con lo obtenido hasta entonces.']],['Fallo',['Una excepción no controlada marca failed.','El error queda en metadata del run.','Fallos de colectores individuales no abortan el run.']]]};
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); document.title=data.title;document.querySelector('#title').textContent=data.title;
    const byId=Object.fromEntries(data.states.map(s=>[s[0],s])), svg=document.querySelector('#diagram'); let out='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#94a3b8"/></marker></defs><rect width="950" height="650" fill="#020617"/><text x="45" y="78" fill="#94a3b8" font-size="12" font-weight="700">CICLO PRINCIPAL</text><path d="M45 105H905M45 285H905M45 455H905" stroke="#334155"/>';
    data.transitions.forEach(t=>{const a=byId[t[0]],b=byId[t[1]], ax=a[3],ay=a[4],bx=b[3],by=b[4];let d;if(ay===by)d=`M${ax+105} ${ay}H${bx-105}`;else d=`M${ax} ${ay+48}V${by-48}`;out+=`<path d="${d}" fill="none" stroke="${t[3]}" stroke-width="2" marker-end="url(#arrow)"/><text x="${(ax+bx)/2}" y="${(ay+by)/2-12}" fill="${t[3]}" font-size="12" text-anchor="middle" font-weight="600">${esc(t[2])}</text>`});
    data.states.forEach(s=>{out+=`<rect x="${s[3]-105}" y="${s[4]-48}" width="210" height="96" rx="12" fill="#0f172a" stroke="${s[5]}" stroke-width="2"/><text x="${s[3]}" y="${s[4]-7}" fill="#e2e8f0" text-anchor="middle" font-size="17" font-weight="700">${esc(s[1])}</text><text x="${s[3]}" y="${s[4]+17}" fill="#94a3b8" text-anchor="middle" font-size="12">${esc(s[2])}</text>`});svg.setAttribute('viewBox','0 0 950 650');svg.innerHTML=out;document.querySelector('#cards').innerHTML=data.cards.map(c=>`<article class="card"><h2>${esc(c[0])}</h2><ul>${c[1].map(i=>`<li>${esc(i)}</li>`).join('')}</ul></article>`).join('');
  </script>
</body>
</html>
