services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aws_inventory
      POSTGRES_USER: inventory
      # Local-only default. Override this value before exposing PostgreSQL or the app externally.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory-local-password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d aws_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD:-inventory-local-password}@postgres:5432/aws_inventory
      AWS_DEFAULT_REGION: us-east-1
      # The bundled stack is bound to localhost, so it can start without user setup.
      # Enable API authentication when publishing it behind an ingress or reverse proxy.
      INVENTORY_API_AUTH_REQUIRED: ${INVENTORY_API_AUTH_REQUIRED:-false}
      INVENTORY_READ_API_KEY: ${INVENTORY_READ_API_KEY:-}
      INVENTORY_WRITE_API_KEY: ${INVENTORY_WRITE_API_KEY:-}
      INVENTORY_ALLOWED_ACCOUNT_IDS: ${INVENTORY_ALLOWED_ACCOUNT_IDS:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_CONCURRENT_INVENTORY_RUNS: 2
      MAX_EXPORT_ROWS: 10000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_AUTH_REQUIRED: ${INVENTORY_API_AUTH_REQUIRED:-false}
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [backend]
volumes:
  postgres_data:
