services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aws_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d aws_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@postgres:5432/aws_inventory
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in your environment}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in your environment}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      INVENTORY_READ_API_KEY: ${INVENTORY_READ_API_KEY:?Set INVENTORY_READ_API_KEY in your environment}
      INVENTORY_WRITE_API_KEY: ${INVENTORY_WRITE_API_KEY:?Set INVENTORY_WRITE_API_KEY in your environment}
      INVENTORY_ALLOWED_ACCOUNT_IDS: ${INVENTORY_ALLOWED_ACCOUNT_IDS:?Set INVENTORY_ALLOWED_ACCOUNT_IDS in your environment}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_CONCURRENT_INVENTORY_RUNS: 2
      MAX_EXPORT_ROWS: 10000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [backend]
volumes:
  postgres_data:
